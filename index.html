<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UcDoc Editor - Word 风格在线编辑器</title>
  <!-- 引入 Remix Icon 字体图标库 -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
  <div id="app">
    <!-- Word 风格 Ribbon 工具栏 -->
    <div id="ribbon-toolbar"></div>
    
    <!-- 编辑器主区域 -->
    <div class="editor"></div>
    
    <!-- 侧边目录（可选） -->
    <div class="catalog" editor-component="catalog" style="display: none;">
      <div class="catalog__header">
        <span>目录</span>
        <div class="catalog__header__close">
          <i></i>
        </div>
      </div>
      <div class="catalog__main"></div>
    </div>
    
    <!-- 批注区域（可选） -->
    <div class="comment" editor-component="comment" style="display: none;"></div>
    
    <!-- 状态栏 -->
    <div class="footer" editor-component="footer">
      <div>
        <span>可见页码：<span class="page-no-list">1</span></span>
        <span>页面：<span class="page-no">1</span>/<span class="page-size">1</span></span>
        <span>字数：<span class="word-count">0</span></span>
        <span>行：<span class="row-no">0</span></span>
        <span>列：<span class="col-no">0</span></span>
      </div>
      <div class="editor-mode" title="编辑模式 (编辑、清洁、只读、表单、设计、涂鸦)">编辑模式</div>
      <div>
        <div class="page-scale-minus" title="缩小 (Ctrl+-)">
          <i class="ri-zoom-out-line"></i>
        </div>
        <span class="page-scale-percentage" title="显示比例 (点击可复原 Ctrl+0)">100%</span>
        <div class="page-scale-add" title="放大 (Ctrl+=)">
          <i class="ri-zoom-in-line"></i>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 引入 Ribbon UI 样式 -->
  <link rel="stylesheet" href="/src/ui/styles/ribbon.css">
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
